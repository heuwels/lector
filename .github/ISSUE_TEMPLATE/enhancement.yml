name: Feature
description: A new capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Features default to P3. Use P2 only if this unblocks a pack or a bug. P1 is not for features.
      options:
        - P2
        - P3
      default: 1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves it.
    validations:
      required: true
