name: Build Lector image
description: Build the production image and tag it by git tree SHA
inputs:
  platform:
    description: linux/amd64 or linux/arm64
    required: true
  push:
    description: Push tree (and optional PR) tags to ghcr
    required: false
    default: 'false'
  load:
    description: Load the image into the local docker engine
    required: false
    default: 'false'
  local_tag:
    description: Extra local tag when load is true, or after a push
    required: false
    default: ''
  pr_number:
    description: If set, also tag ghcr.io/heuwels/lector:pr-<n>-<arch>
    required: false
    default: ''
  git_commit:
    description: GIT_COMMIT build-arg. Defaults to HEAD.
    required: false
    default: ''
  image_tag:
    description: >
      Tag base, which the action suffixes with the arch. Defaults to
      `tree-<tree>`. A release passes its own base so the build runs again at
      the tag, because the tree tag already holds the master build.
    required: false
    default: ''
  write_registry_cache:
    description: Also write the registry BuildKit cache
    required: false
    default: 'false'
  bake_dicts:
    description: >
      BAKE_DICTS build-arg (#438). Empty builds the slim image, which ships no
      dictionaries. `all` bakes every pinned language for the offline `:full`
      tag. Pass image_tag with this, or the baked image overwrites the slim
      image under the same tag.
    required: false
    default: ''
outputs:
  tree:
    description: Git tree SHA of HEAD
    value: ${{ steps.meta.outputs.tree }}
  image:
    description: tree-tagged image reference
    value: ${{ steps.meta.outputs.image }}
runs:
  using: composite
  steps:
    - name: Compute image metadata
      id: meta
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        INPUT_COMMIT: ${{ inputs.git_commit }}
        INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        PR_NUMBER: ${{ inputs.pr_number }}
        LOCAL_TAG: ${{ inputs.local_tag }}
        DO_LOAD: ${{ inputs.load }}
      run: |
        set -euo pipefail
        tree=$(git rev-parse 'HEAD^{tree}')
        arch="${PLATFORM#linux/}"
        repo="ghcr.io/heuwels/lector"
        # A release passes its own base. The reuse check below then inspects
        # that tag rather than the tree tag, so the build runs again and stamps
        # the release version into the bundle.
        base="${INPUT_IMAGE_TAG:-tree-${tree}}"
        image="${repo}:${base}-${arch}"
        commit="${INPUT_COMMIT:-$(git rev-parse HEAD)}"
        # Describe the commit we report, not the checkout. On pull_request the
        # checkout is an ephemeral merge commit that is in no branch, so
        # describing HEAD gave a version whose -g<sha> disagreed with the
        # commit beside it in Settings -> About.
        version=$(git describe --tags --match 'v*' --always "$commit")

        {
          echo "tree=$tree"
          echo "arch=$arch"
          echo "image=$image"
          echo "version=$version"
          echo "commit=$commit"
        } >>"$GITHUB_OUTPUT"

        {
          echo "tags<<EOF"
          echo "$image"
          if [ -n "$PR_NUMBER" ]; then
            echo "${repo}:pr-${PR_NUMBER}-${arch}"
          fi
          if [ "$DO_LOAD" = "true" ] && [ -n "$LOCAL_TAG" ]; then
            echo "$LOCAL_TAG"
          fi
          echo "EOF"
        } >>"$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - name: Log in to ghcr
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Reuse existing tree image
      id: existing
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if docker buildx imagetools inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
          echo "exists=true" >>"$GITHUB_OUTPUT"
        else
          echo "exists=false" >>"$GITHUB_OUTPUT"
        fi

    - name: Build production image
      if: ${{ steps.existing.outputs.exists != 'true' && inputs.write_registry_cache != 'true' }}
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.load == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        platforms: ${{ inputs.platform }}
        provenance: false
        build-args: |
          APP_VERSION=${{ steps.meta.outputs.version }}
          GIT_COMMIT=${{ steps.meta.outputs.commit }}
          BAKE_DICTS=${{ inputs.bake_dicts }}
        cache-from: |
          type=gha,scope=lector-${{ steps.meta.outputs.arch }}
          type=registry,ref=ghcr.io/heuwels/lector:buildcache-${{ steps.meta.outputs.arch }}
          type=registry,ref=ghcr.io/heuwels/lector:master
        cache-to: type=gha,scope=lector-${{ steps.meta.outputs.arch }},mode=max,ignore-error=true

    - name: Build production image with registry cache
      if: ${{ steps.existing.outputs.exists != 'true' && inputs.write_registry_cache == 'true' }}
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.load == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        platforms: ${{ inputs.platform }}
        provenance: false
        build-args: |
          APP_VERSION=${{ steps.meta.outputs.version }}
          GIT_COMMIT=${{ steps.meta.outputs.commit }}
          BAKE_DICTS=${{ inputs.bake_dicts }}
        cache-from: |
          type=gha,scope=lector-${{ steps.meta.outputs.arch }}
          type=registry,ref=ghcr.io/heuwels/lector:buildcache-${{ steps.meta.outputs.arch }}
          type=registry,ref=ghcr.io/heuwels/lector:master
        cache-to: |
          type=gha,scope=lector-${{ steps.meta.outputs.arch }},mode=max,ignore-error=true
          type=registry,ref=ghcr.io/heuwels/lector:buildcache-${{ steps.meta.outputs.arch }},mode=max,ignore-error=true

    - name: Pull image for local use
      if: ${{ inputs.local_tag != '' && inputs.push == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        docker pull "${{ steps.meta.outputs.image }}"
        docker tag "${{ steps.meta.outputs.image }}" "${{ inputs.local_tag }}"
