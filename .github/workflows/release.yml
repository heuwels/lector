name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      # eSpeak NG backs the espeak TTS engine (#307 §3.2c) — the Esperanto e2e
      # spec synthesizes through the real binary, exactly as in ci.yml. Keep
      # the two e2e jobs' system deps in lockstep or a release tag fails on
      # specs that passed PR CI.
      - name: Install eSpeak NG
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: npm ci
      - run: cd api && bun install --frozen-lockfile
      - uses: ./.github/actions/fetch-dicts
      - uses: ./.github/actions/setup-playwright
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The commit already has a multi-arch sha-<commit> image from docker.yml.
  # Apply the semver tags to that image. Do not build it again.
  publish:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, e2e-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/heuwels/lector
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Retag the published image
        run: |
          set -euo pipefail
          src="ghcr.io/heuwels/lector:sha-${{ github.sha }}"
          if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "No published image at $src. Tag a commit that docker.yml already published." >&2
            exit 1
          fi
          TAG_ARGS=""
          while IFS= read -r TAG; do
            TAG_ARGS="$TAG_ARGS -t $TAG"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create $TAG_ARGS "$src"
