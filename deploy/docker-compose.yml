services:
  ollama:
    image: ollama/ollama:latest
    container_name: lector-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment for GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  lector:
    # Pulled through registry.lector.dev, which counts pulls so we have a rough
    # idea how many installs exist. No IP address is stored — see
    # https://lector.dev/privacy/
    image: registry.lector.dev/lector:${LECTOR_VERSION:-latest}
    # Use this instead if you would rather not be included in rough install
    # statistics gathering. Identical image, pulled straight from GitHub.
    # image: ghcr.io/heuwels/lector:${LECTOR_VERSION:-latest}
    container_name: lector
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      # On-device dictionaries (#438). The image ships none of them, so this
      # volume must outlive an image pull. Without it every `docker compose
      # pull && up -d` throws the files away and downloads them again.
      #
      # A named volume, not a path under DATA_PATH: the dictionaries are large
      # and re-downloadable, so they stay out of whatever backs up your data
      # directory. Set DICT_DIR=/app/data/dict instead if you would rather keep
      # one directory for everything.
      - lector-dict:/app/dict
    ports:
      - "${WEB_PORT:-3400}:3000"
      # The Hono API is published on a fixed host :3457; the browser is told
      # where to reach it via API_URL below (which carries host + port).
      - "3457:3457"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Deployment mode — selfhost (default) or cloud. Cloud refuses to boot
      # until accounts/auth ship (#218; seam tracked in #242).
      - LECTOR_MODE=${LECTOR_MODE:-selfhost}
      # Browser-facing API origin — the web app calls Hono directly, so this
      # must be reachable FROM THE BROWSER (the host/port you open the app on),
      # not an internal Docker name. Injected into /__env.js at startup. Unset →
      # falls back to http://localhost:3457 (only correct when browsing locally).
      - API_URL=${API_URL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      # OpenAI-compatible backend — points at the bundled ollama service by default.
      - OPENAI_COMPAT_URL=${OPENAI_COMPAT_URL:-http://ollama:11434}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:-llama3.1:8b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_OAUTH_TOKEN=${CLAUDE_OAUTH_TOKEN:-}
      # Background word→domain classifier that feeds the fluency radar. The
      # code gate defaults OFF (so tests never fire LLM calls), so deployments
      # must opt in — without this the radar reads "pending classification"
      # forever. Runs on the provider above; set 0 to disable, or point
      # CLASSIFY_LLM_URL at a dedicated OpenAI-compatible endpoint.
      - CLASSIFY_WORKER=${CLASSIFY_WORKER:-1}
      # Error tracking + tracing (optional). One DSN covers the API and, via
      # /__env.js, the browser. Point it at Sentry.io, self-hosted Sentry, or
      # GlitchTip. Unset → Sentry stays off.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-}
      # On-device dictionaries (#438). Unset downloads a dictionary when you
      # add its language in the picker. Name languages to pre-fetch them at
      # boot, or use `all` for every published language.
      - DICT_LANGS=${DICT_LANGS:-}
      # Set to 0 to never download. Use it with the `:full` image tag, which
      # bakes every dictionary, for an install with no internet.
      - DICT_FETCH=${DICT_FETCH:-}
      # Move the dictionaries under your data directory instead of the named
      # volume above. Both paths must agree.
      - DICT_DIR=${DICT_DIR:-/app/dict}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ollama-data:
  lector-dict:
